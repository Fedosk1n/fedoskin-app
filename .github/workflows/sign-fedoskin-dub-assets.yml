name: Authorize Fedoskin English dub uploads
on:
  push:
    branches: [codex/dub-publish-494b67d8c395]
    paths: [.github/workflows/sign-fedoskin-dub-assets.yml]
permissions: {}
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Return encrypted, time-limited upload URLs
        env:
          R2_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          cat > "$RUNNER_TEMP/pilot-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAudKgH6V3g5Tp8VNPf3Pi
          38NccWHmfop70xxcmX/PBSZsWiiqAoLEsaT8saORV/Lds/N7VidNS3ULAQ4xJRAp
          yiythiahCCE47buwOscxlSCWd9VvkNs6Xd0Vi9Verj56GEP10H8+6X1ZsLSv3arA
          1BxKKWalQaKd6igHCIFAxWZaLNTAZwT1PMLlXt9SNCVGqWPFrkuhB3YGbxd8EFrX
          C2UiYRgiOBPOV/qpjYFPaC+b+KtbCV6avzP0C7aCsgfFq5CocLNeT1T7Nm5r0vaX
          i8FtULGiLg6aHro8c67kpss+ad5nrBMJclzb1LMYeXyL7/cjqFbbC1rSXy2obVzP
          MwIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PYCODE'
          import datetime as dt, hashlib, hmac, json, os, secrets, subprocess, urllib.parse as u, base64
          key_id, secret = os.environ['R2_ID'], os.environ['R2_SECRET']
          assert key_id and secret
          host = '424be49c67f065e5c755e508f41f2b88.r2.cloudflarestorage.com'
          now = dt.datetime.now(dt.timezone.utc)
          date, stamp = now.strftime('%Y%m%d'), now.strftime('%Y%m%dT%H%M%SZ')
          scope = date + '/auto/s3/aws4_request'
          def sign(key, msg):
              return hmac.new(key, msg.encode(), hashlib.sha256).digest()
          derived = ('AWS4' + secret).encode()
          for item in (date, 'auto', 's3', 'aws4_request'):
              derived = sign(derived, item)
          out = {}
          for name in ('dub-gd-windmill-entry-en-voice-7e60859da10c.mp4', 'dub-gd-windmill-entry-en-voice-ac475754ccd8.mp4'):
              path = '/fedoskin-video/' + name
              query = u.urlencode(sorted({
                  'X-Amz-Algorithm':'AWS4-HMAC-SHA256', 'X-Amz-Credential':key_id+'/'+scope,
                  'X-Amz-Date':stamp, 'X-Amz-Expires':'900', 'X-Amz-SignedHeaders':'host'
              }.items()), quote_via=u.quote)
              canonical = 'PUT\n'+path+'\n'+query+'\nhost:'+host+'\n\nhost\nUNSIGNED-PAYLOAD'
              auth = 'AWS4-HMAC-SHA256\n'+stamp+'\n'+scope+'\n'+hashlib.sha256(canonical.encode()).hexdigest()
              out[name] = 'https://'+host+path+'?'+query+'&X-Amz-Signature='+sign(derived,auth).hex()
          password = secrets.token_hex(32)
          encrypted_key = subprocess.check_output(['openssl','pkeyutl','-encrypt','-pubin','-inkey',os.environ['RUNNER_TEMP']+'/pilot-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=password.encode())
          encrypted_urls = subprocess.check_output(['openssl','enc','-aes-256-cbc','-pbkdf2','-salt','-pass','env:PILOT_PASSWORD','-a','-A'],input=json.dumps(out).encode(),env={**os.environ,'PILOT_PASSWORD':password})
          print('PILOT_KEY=' + base64.b64encode(encrypted_key).decode())
          print('PILOT_PAYLOAD=' + encrypted_urls.decode())
          PYCODE
