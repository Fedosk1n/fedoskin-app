<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка видео</title>
<style>
body{margin:0;padding:16px;background:#0b0b0c;color:#f2efe9;font:16px/1.45 -apple-system,system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.r{padding:10px 12px;border:1px solid #2a2a2e;border-radius:12px;margin:8px 0}
.ok{color:#3bd16f}.bad{color:#ff7a6b}.wait{color:#aaa}
video{width:46%;max-height:220px;background:#222;border-radius:10px;margin-right:2%}
small{color:#999;word-break:break-all}
</style></head><body>
<h1>Проверка видео на этом телефоне</h1>
<p>Подожди 15 секунд и пришли скриншот всей страницы.</p>
<div id="out"></div>
<div><video id="a" muted playsinline></video><video id="b" muted playsinline></video></div>
<p><small id="ua"></small></p>
<script>
// Temporary diagnostics (09.11.2026): why an R2 lesson does not play on the owner's iPhone.
const B = 'https://fedoskin-push.fedosk1n.workers.dev', FILE = 'fw-3step-5j8vxy9g.mp4';
const out = document.getElementById('out');
const row = (name) => { const d = document.createElement('div'); d.className = 'r'; d.innerHTML = '<b>' + name + '</b>: <span class="wait">проверяю…</span>'; out.appendChild(d); return (cls, txt) => { d.querySelector('span').className = cls; d.querySelector('span').textContent = txt; }; };
document.getElementById('ua').textContent = navigator.userAgent + ' · standalone: ' + (navigator.standalone || matchMedia('(display-mode: standalone)').matches);
(async () => {
  const r1 = row('1. Пропуск от сервера');
  let p = '';
  try { const r = await fetch(B + '/pass', { cache: 'no-store' }); const j = await r.json().catch(() => ({})); p = j.p || ''; r1(p ? 'ok' : 'bad', r.status + (p ? ' — получен' : ' — нет пропуска ' + JSON.stringify(j))); } catch (e) { r1('bad', 'ошибка: ' + e.message); }
  const url = B + '/v/' + FILE + '?p=' + encodeURIComponent(p);
  const r2 = row('2. Кусок файла по пропуску');
  try { const r = await fetch(url, { headers: { Range: 'bytes=0-1' }, cache: 'no-store' }); r2(r.status === 206 ? 'ok' : 'bad', r.status + ' ' + (r.headers.get('content-range') || '')); } catch (e) { r2('bad', 'ошибка: ' + e.message); }
  const test = (id, name, cors) => new Promise(res => {
    const rr = row(name), v = document.getElementById(id); const ev = [];
    if (cors) v.crossOrigin = 'anonymous';
    ['loadedmetadata', 'canplay', 'playing', 'stalled', 'error'].forEach(n => v.addEventListener(n, () => ev.push(n + '@' + v.currentTime.toFixed(1))));
    v.src = url; const pr = v.play(); if (pr && pr.catch) pr.catch(e => ev.push('play(): ' + e.name));
    setTimeout(() => { const good = v.currentTime > 1; rr(good ? 'ok' : 'bad', (good ? 'играет, ' : 'НЕ играет, ') + 't=' + v.currentTime.toFixed(1) + ' rs=' + v.readyState + ' ns=' + v.networkState + (v.error ? ' err=' + v.error.code + ' ' + (v.error.message || '') : '') + ' · ' + ev.join(', ')); res(); }, 9000);
  });
  await Promise.all([test('a', '3. Видео с crossorigin (как в приложении)', true), test('b', '4. Видео без crossorigin', false)]);
})();
</script>
</body></html>
